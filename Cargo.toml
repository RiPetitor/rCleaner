[package]
name = "rcleaner"
version = "1.0.1"
edition = "2024"

[dependencies]
# TUI и терминал
ratatui = "0.29"
crossterm = "0.29"

# Системная информация
sysinfo = "0.37"

# Сериализация
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Обработка ошибок
thiserror = "1.0"

# Логирование
log = "0.4"
env_logger = "0.11"

# Файловые операции
walkdir = "2.5"
fs_extra = "1.3"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }

# Системные утилиты
regex = "1.10"
libc = "0.2"

# Параллелизм
rayon = "1.10"

# CLI
clap = { version = "4", features = ["derive"] }

# systemd (чистый Rust без внешних зависимостей)
libsystemd = "0.7"

# Опционально для пакетных менеджеров
flatpak = { version = "0.18", optional = true }

[features]
default = ["systemd"]
systemd = []
flatpak = ["dep:flatpak"]
all-managers = ["flatpak"]

[[bin]]
name = "rcleaner"
path = "src/main.rs"
